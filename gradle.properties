# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ------------------------------------------------------------------
# Fabric toolchain for Minecraft 1.21.11
# (1.21.11 is the last OBFUSCATED Minecraft version, which is why the
#  Loom plugin id in build.gradle is `net.fabricmc.fabric-loom-remap`.)
#
# If any of these fail to resolve in the future, current values live at
# https://fabricmc.net/develop/
# ------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.4

# Fabric API
fabric_version=0.141.4+1.21.11

# Loom (Gradle plugin). 1.14.x is the recommended line for 1.21.11.
loom_version=1.14.10

# Mod Properties
mod_version=1.0.0
maven_group=com.contisupply.fallout
archives_base_name=fallout
